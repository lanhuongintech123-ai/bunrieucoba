<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bún Riêu Mẹ Xoài - Vua Bún Riêu Cua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      user-select: none; 
      -webkit-user-select: none; 
      touch-action: manipulation;
      background-color: #120508;
    }
    .brand-font { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }

    .bg-main-board { background-color: #1c1917; }
    .bg-card-brown { background-color: #292524; }
    .bg-slot-item { background-color: #383230; }
    .border-game-edge { border-color: #574d49; }

    @keyframes smokeFlow {
      0% { transform: translateY(0) scaleX(0.7) scaleY(0.9); opacity: 0; }
      25% { opacity: 0.55; }
      50% { transform: translateY(-16px) scaleX(1.2) scaleY(1.1); opacity: 0.35; }
      100% { transform: translateY(-34px) scaleX(1.6) scaleY(1.4); opacity: 0; }
    }
    .steam-soft { animation: smokeFlow 2.8s infinite ease-out; }

    @keyframes dropIn {
      0% { transform: scale(0.3) translateY(-25px); opacity: 0; }
      65% { transform: scale(1.1) translateY(3px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .drop-item { animation: dropIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    .food-glow { filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5)); }
    .bowl-depth {
      box-shadow: inset 0 8px 18px rgba(0,0,0,0.5), 0 10px 24px rgba(0,0,0,0.65);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="min-h-screen flex justify-center items-center p-0 sm:py-2">
  <div id="game-app" class="w-full max-w-[430px] h-[100dvh] sm:h-[890px] bg-stone-950 text-stone-100 flex flex-col justify-between shadow-2xl relative overflow-hidden sm:rounded-[36px] sm:border-[6px] sm:border-stone-800">
    
    <!-- 1. TOP HEADER -->
    <header class="pt-3 px-3.5 pb-2 z-20 flex items-center justify-between border-b border-stone-800 bg-stone-900/95">
      <div class="flex items-center gap-2">
        <button onclick="togglePauseGame()" class="text-amber-300 font-black text-sm bg-stone-800 w-8 h-8 rounded-xl border border-stone-700 flex items-center justify-center active:scale-95 shadow">
          <span id="pause-icon">⏸</span>
        </button>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-sm font-black text-white" id="hud-day">Ngày 1</span>
            <span class="text-[10px] bg-amber-400 text-stone-950 font-black px-1.5 py-0.2 rounded" id="shift-clock">03:00</span>
          </div>
          <div class="text-[10px] text-stone-400 font-semibold" id="shop-title-sub">Gánh Vỉa Hè</div>
        </div>
      </div>

      <!-- Két tiền -->
      <div class="text-center">
        <div class="text-[9px] font-black uppercase tracking-widest text-amber-400/80">KÉT TIỀN</div>
        <div class="font-mono text-base font-black text-amber-300" id="hud-money">300.000đ</div>
      </div>

      <!-- Heo đất -->
      <div class="flex items-center gap-1.5 text-right">
        <div class="cursor-pointer bg-stone-800 px-2.5 py-1 rounded-xl border border-stone-700 shadow" onclick="openModal('piggy')">
          <div class="text-xs font-black text-pink-400 flex items-center gap-1 justify-end">
            <span>🐷</span>
            <span id="hud-piggy">0đ</span>
          </div>
          <div class="text-[9px] text-amber-400 font-bold" id="hud-combo">Combo: x0</div>
        </div>
      </div>
    </header>

    <!-- 2. KHU VỰC QUÁN ĂN (MÁI HIÊN & 3 BÀN ĂN) -->
    <section class="px-3 pt-1.5 flex flex-col gap-1.5">
      <div class="relative bg-gradient-to-b from-amber-950 via-stone-900 to-stone-900 rounded-3xl pt-2 pb-2.5 px-3 border border-amber-600/40 shadow-lg">
        
        <!-- Bảng hiệu Bún riêu Mẹ Xoài -->
        <div class="bg-gradient-to-b from-stone-950 to-stone-900 border-2 border-amber-400/90 rounded-2xl py-1 px-4 text-center mx-auto max-w-[210px] shadow-md">
          <div class="text-xs font-black text-amber-300 tracking-wide uppercase">Bún riêu Mẹ Xoài</div>
          <div class="text-[9px] font-bold text-amber-200 tracking-widest uppercase">VUA BÚN RIÊU CUA</div>
        </div>

        <!-- 3 Bàn khách ngồi -->
        <div class="grid grid-cols-3 gap-2 mt-2" id="tables-row">
          <div id="table-slot-0" onclick="selectTable(0)" class="table-slot bg-stone-800/80 border border-stone-700 rounded-2xl p-1 flex flex-col items-center justify-center min-h-[62px] cursor-pointer transition active:scale-95">
            <span class="text-[11px] text-stone-500 font-bold">Bàn 1 Trống</span>
          </div>
          <div id="table-slot-1" onclick="selectTable(1)" class="table-slot bg-stone-800/80 border border-stone-700 rounded-2xl p-1 flex flex-col items-center justify-center min-h-[62px] cursor-pointer transition active:scale-95">
            <span class="text-[11px] text-stone-500 font-bold">Bàn 2 Trống</span>
          </div>
          <div id="table-slot-2" onclick="selectTable(2)" class="table-slot bg-stone-800/80 border border-stone-700 rounded-2xl p-1 flex flex-col items-center justify-center min-h-[62px] cursor-pointer transition active:scale-95">
            <span class="text-[11px] text-stone-500 font-bold">Bàn 3 Trống</span>
          </div>
        </div>
      </div>

      <!-- BONG BÓNG LỜI THOẠI & THANH KIÊN NHẪN XANH LÁ -->
      <div id="order-balloon" class="bg-stone-900 border border-stone-700 rounded-2xl p-2.5 shadow-md flex flex-col gap-1.5">
        <div class="flex items-center gap-2.5">
          <div class="w-11 h-11 bg-stone-800 rounded-xl border border-stone-700 flex items-center justify-center text-2xl flex-shrink-0" id="order-bowl-icon">
            🥣
          </div>
          <div class="flex-1 text-xs text-stone-200 leading-snug font-medium" id="order-dialogue-text">
            Chưa có khách gọi món. Hãy chờ khách ghé nhé!
          </div>
        </div>
        <div class="w-full bg-stone-950 h-1.5 rounded-full overflow-hidden">
          <div id="patience-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
        </div>
      </div>
    </section>

    <!-- 3. KHU BẾP NẤU TRUNG TÂM -->
    <main class="flex-1 flex flex-col justify-between px-3 py-1 gap-1.5">
      
      <div class="bg-main-board rounded-3xl p-2.5 border border-stone-700 shadow-md flex flex-col gap-1.5 relative">
        
        <!-- HÀNG TRÊN: VẬT CHỨA & CHAN NƯỚC -->
        <div class="grid grid-cols-4 gap-2">
          <!-- 1. Lấy Tô Sứ -->
          <button onclick="drawContainer('bowl')" class="bg-card-brown border border-game-edge rounded-2xl p-1.5 flex flex-col items-center justify-center relative active:scale-95 shadow">
            <span id="badge-bowls" class="absolute -top-1.5 -right-1 bg-amber-400 text-stone-950 font-black text-[9px] px-1.5 rounded-full">20</span>
            <div class="w-7 h-7 flex items-center justify-center">
              <div class="w-6 h-6 rounded-full border-2 border-blue-900 bg-white flex items-center justify-center shadow-inner">
                <div class="w-3.5 h-1 rounded-full bg-blue-300"></div>
              </div>
            </div>
            <span class="text-[10px] font-black text-amber-200 mt-0.5">Tô Sứ</span>
          </button>

          <!-- 2. Hộp App Mang Về (Khóa Ngày 1-2, Mở Ngày 3) -->
          <div id="btn-box-wrapper" class="w-full h-full"></div>

          <!-- 3. Nồi Lẩu VIP (Mở Ngày 25) -->
          <div id="btn-hotpot-wrapper" class="w-full h-full"></div>

          <!-- 4. Chan Nước Cua Đồng -->
          <button onclick="addBroth()" class="bg-card-brown border-2 border-amber-500/80 rounded-2xl p-1.5 flex flex-col items-center justify-center relative active:scale-95 shadow">
            <div class="relative w-7 h-7 flex items-center justify-center">
              <svg class="w-7 h-7 food-glow" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="27" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
                <circle cx="30" cy="30" r="23" fill="#ea580c"/>
                <ellipse cx="30" cy="27" rx="19" ry="13" fill="#c2410c" opacity="0.85"/>
                <circle cx="36" cy="23" r="4" fill="#fb923c"/>
              </svg>
              <div class="absolute -top-1 flex gap-0.5 pointer-events-none">
                <div class="w-1 h-2.5 bg-white/70 rounded-full blur-[0.5px] steam-soft"></div>
              </div>
            </div>
            <span class="text-[10px] font-black text-amber-300 mt-0.5">Chan Nước</span>
          </button>
        </div>

        <!-- HÀNG GIỮA: SỢI (TRÁI) - TÔ BÚN GỐM SỨ (GIỮA) - QUẦY NƯỚC & GIA VỊ (PHẢI) -->
        <div class="grid grid-cols-12 gap-2 items-center my-0.5">
          
          <!-- Cột trái: Bộ 3 loại sợi (Bún, Bánh Đa, Miến) -->
          <div class="col-span-3 flex flex-col gap-1.5">
            <button onclick="selectNoodle('bun')" class="bg-card-brown border border-game-edge rounded-xl p-1.5 flex items-center justify-between relative active:scale-95 shadow">
              <span class="text-xl">🍜</span>
              <div class="text-right">
                <span class="text-[9px] font-black text-stone-200 block leading-tight">Bún</span>
                <span id="badge-bun" class="text-[8px] font-black text-amber-400">15</span>
              </div>
            </button>

            <div id="btn-banhda-wrapper" class="w-full"></div>
            <div id="btn-mien-wrapper" class="w-full"></div>
          </div>

          <!-- Ở giữa: TÔ BÚN GỐM SỨ HOA LAM TO TRÒN -->
          <div class="col-span-6 bg-stone-900 rounded-3xl p-2 h-[164px] flex flex-col items-center justify-center relative shadow-inner overflow-hidden border-2 border-stone-800" id="prep-mat">
            <div id="prep-prompt" class="text-stone-400 text-center text-xs font-bold leading-relaxed px-2">
              Chưa có tô.<br><span class="text-amber-400 font-extrabold">Chạm "Tô Sứ"</span> ở trên để lấy.
            </div>

            <!-- Tô bún tròn gốm sứ Bát Tràng to rõ -->
            <div id="visual-dish" class="hidden relative w-36 h-36 rounded-full border-[6px] border-blue-950 bg-gradient-to-b from-stone-100 via-white to-blue-50 bowl-depth flex items-center justify-center overflow-hidden transition-all duration-300">
              <div class="absolute inset-1 rounded-full border border-blue-600/30 pointer-events-none z-10"></div>
              
              <!-- Nước dùng riêu cua -->
              <div id="visual-broth" class="hidden absolute inset-0 bg-gradient-to-t from-red-600/85 via-orange-500/65 to-amber-400/45 rounded-full z-10 pointer-events-none shadow-inner"></div>
              
              <!-- Sợi bún/bánh đa/miến -->
              <div id="visual-noodle-layer" class="absolute inset-2 flex items-center justify-center z-0"></div>

              <!-- Lớp Topping nổi -->
              <div id="visual-toppings-layer" class="absolute inset-0 p-3 flex flex-wrap items-center justify-center gap-1 z-20 pointer-events-none"></div>
            </div>
          </div>

          <!-- Cột phải: Quầy Nước Uống Thông Minh + Mắm Tôm & Ớt Sa Tế -->
          <div class="col-span-3 flex flex-col gap-1.5 h-full justify-center">
            <button onclick="toggleDrinkSelector()" class="bg-card-brown border border-emerald-500/70 rounded-xl py-1.5 px-1.5 flex flex-col items-center justify-center relative active:scale-95 shadow">
              <span id="badge-drink" class="hidden absolute -top-1 -right-1 bg-emerald-400 text-stone-950 font-black text-[8px] px-1 rounded-full">✓</span>
              <div id="current-drink-icon" class="w-6 h-6 flex items-center justify-center"></div>
              <span class="text-[9px] font-black text-emerald-300 mt-0.5 truncate w-full text-center" id="current-drink-name">Đổi Nước</span>
            </button>

            <button onclick="addShrimpPaste()" class="bg-card-brown border border-purple-500/60 rounded-xl py-1.5 px-1 flex items-center justify-center gap-1 relative active:scale-95 shadow">
              <span id="badge-shrimp" class="hidden absolute -top-1 -right-1 bg-purple-400 text-stone-950 font-black text-[8px] px-1 rounded-full">✓</span>
              <span class="text-base">🫙</span>
              <span class="text-[9px] font-black text-purple-300">Mắm</span>
            </button>

            <button onclick="addChiliSauce()" class="bg-card-brown border border-red-500/60 rounded-xl py-1.5 px-1 flex items-center justify-center gap-1 relative active:scale-95 shadow">
              <span id="badge-chili" class="hidden absolute -top-1 -right-1 bg-red-400 text-white font-black text-[8px] px-1 rounded-full">✓</span>
              <span class="text-base">🌶️</span>
              <span class="text-[9px] font-black text-red-300">Ớt</span>
            </button>
          </div>
        </div>

        <!-- MENU CHỌN 4 LOẠI NƯỚC THẢ XUỐNG -->
        <div id="drink-selector-popup" class="hidden absolute top-14 right-2 z-40 bg-stone-900 border-2 border-emerald-500/80 rounded-2xl p-2 shadow-2xl flex flex-col gap-1.5 w-48">
          <div class="flex justify-between items-center px-1 pb-1 border-b border-stone-800">
            <span class="text-[10px] font-black text-emerald-300 uppercase tracking-wide">Quầy Giải Khát</span>
            <span class="text-[9px] text-stone-400">Chọn 1 món</span>
          </div>
          <div class="grid grid-cols-2 gap-1.5" id="drinks-selection-grid"></div>
        </div>

        <!-- HÀNG NÚT GIAO MÓN & ĐỔ ĐI -->
        <div class="flex items-center gap-2 pt-0.5">
          <button onclick="serveCurrentDish()" class="flex-1 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 active:scale-95 text-white font-black py-2.5 rounded-2xl shadow-lg border border-emerald-400 flex items-center justify-center gap-2 text-sm">
            <span>🛎️</span>
            <span>GIAO MÓN CHO KHÁCH</span>
          </button>
          <button onclick="trashDish()" class="bg-stone-800 border border-red-500/40 hover:bg-red-950/60 active:scale-95 text-red-300 font-extrabold px-3.5 py-2.5 rounded-2xl text-xs flex items-center gap-1 shadow">
            <span>🗑️</span>
            <span>Đổ đi</span>
          </button>
        </div>

      </div>

      <!-- 4. KHAY TOPPING 2 HÀNG THEO TỶ LỆ VÀNG (6 CỘT X 2 HÀNG) -->
      <div class="bg-main-board rounded-3xl p-2 border border-stone-700 shadow-md">
        <div class="grid grid-cols-6 gap-1.5 mb-1.5" id="pantry-row-1"></div>
        <div class="grid grid-cols-6 gap-1.5" id="pantry-row-2"></div>
      </div>

    </main>

    <!-- 5. THANH TIỆN ÍCH DƯỚI CÙNG -->
    <footer class="bg-stone-900/95 border-t border-stone-800 py-2.5 px-4 flex justify-around items-center z-30">
      <button onclick="openModal('market')" class="flex flex-col items-center text-xs text-amber-300 font-extrabold active:scale-95">
        <span class="text-xl">🛒</span>
        <span>Đi chợ</span>
      </button>
      <button onclick="openModal('shop')" class="flex flex-col items-center text-xs text-stone-400 font-bold active:scale-95">
        <span class="text-xl">👥</span>
        <span>Thuê người</span>
      </button>
      <button onclick="openModal('hui')" class="flex flex-col items-center text-xs text-stone-400 font-bold active:scale-95">
        <span class="text-xl">🤝</span>
        <span>Hốt hụi</span>
      </button>
      <button onclick="openModal('piggy')" class="flex flex-col items-center text-xs text-stone-400 font-bold active:scale-95">
        <span class="text-xl">🐷</span>
        <span>Nuôi heo</span>
      </button>
    </footer>

    <!-- MODAL POPUP TIỆN ÍCH -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3">
      <div class="bg-stone-900 border-2 border-amber-600 rounded-3xl max-w-sm w-full p-4 flex flex-col gap-3 shadow-2xl max-h-[85vh]">
        <div class="flex justify-between items-center border-b border-stone-800 pb-2">
          <h3 id="modal-title" class="text-sm font-black text-amber-300 uppercase">TIÊU ĐỀ</h3>
          <button onclick="closeModal()" class="w-7 h-7 bg-stone-800 rounded-full text-stone-300 font-black">✕</button>
        </div>
        <div id="modal-content" class="flex-1 overflow-y-auto no-scrollbar space-y-2 text-xs"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-stone-900/95 text-white px-4 py-2 rounded-full border border-amber-400 shadow-xl text-xs font-bold pointer-events-none transition-all duration-300 opacity-0 -translate-y-2 z-50">
      Thông báo
    </div>
  </div>

  <script>
    const Sound = {
      ctx: null,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      play(freq, type = 'sine', duration = 0.12) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + duration);
      },
      plop() { this.play(340, 'sine', 0.1); },
      pour() { this.play(240, 'triangle', 0.22); },
      coin() { this.play(987, 'sine', 0.28); },
      buzz() { this.play(140, 'sawtooth', 0.2); }
    };

    /* 4 LOẠI NƯỚC UỐNG */
    const DRINKS = {
      tea: {
        name: 'Trà Đá', unlockDay: 1, price: 5000,
        svg: `<svg class="w-6 h-6 food-glow" viewBox="0 0 32 32">
          <path d="M7 6 L25 6 L22 28 L10 28 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
          <line x1="12" y1="8" x2="11" y2="26" stroke="#ca8a04" stroke-width="1.2"/>
          <line x1="16" y1="8" x2="16" y2="26" stroke="#ca8a04" stroke-width="1.2"/>
          <line x1="20" y1="8" x2="21" y2="26" stroke="#ca8a04" stroke-width="1.2"/>
          <rect x="10" y="8" width="5" height="5" rx="1" fill="#ffffff" opacity="0.85"/>
          <rect x="17" y="10" width="5" height="5" rx="1" fill="#ffffff" opacity="0.85"/>
        </svg>`
      },
      kumquat: {
        name: 'Trà Tắc', unlockDay: 6, price: 10000,
        svg: `<svg class="w-6 h-6 food-glow" viewBox="0 0 32 32">
          <path d="M7 6 L25 6 L22 28 L10 28 Z" fill="#fde047" stroke="#eab308" stroke-width="1.8"/>
          <circle cx="16" cy="12" r="4.5" fill="#f97316"/>
          <circle cx="16" cy="12" r="2" fill="#fef08a"/>
        </svg>`
      },
      soya: {
        name: 'Sữa Đậu', unlockDay: 12, price: 8000,
        svg: `<svg class="w-6 h-6 food-glow" viewBox="0 0 32 32">
          <path d="M8 8 L24 8 L21 28 L11 28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
          <line x1="10" y1="12" x2="22" y2="12" stroke="#e2e8f0" stroke-width="2"/>
        </svg>`
      },
      soda: {
        name: 'Xá Xị', unlockDay: 18, price: 12000,
        svg: `<svg class="w-6 h-6 food-glow" viewBox="0 0 32 32">
          <rect x="9" y="6" width="14" height="22" rx="3.5" fill="#dc2626" stroke="#991b1b" stroke-width="1.8"/>
          <line x1="12" y1="12" x2="20" y2="12" stroke="#ffffff" stroke-width="2"/>
        </svg>`
      }
    };

    /* HỆ THỐNG 12 TOPPING */
    const TOPPINGS_ROW_1 = [
      { 
        key: 'rieu_cua', name: 'Gạch riêu', unlockDay: 1, price: 10000, 
        iconSvg: `<svg class="w-8 h-8 food-glow" viewBox="0 0 44 44">
          <defs>
            <radialGradient id="rieuReal" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fdba74"/>
              <stop offset="50%" stop-color="#ea580c"/>
              <stop offset="100%" stop-color="#7c2d12"/>
            </radialGradient>
          </defs>
          <path d="M7 21 C5 13, 16 7, 24 7 C33 7, 40 12, 39 21 C38 28, 33 33, 26 36 C16 38, 10 34, 7 28 Z" fill="url(#rieuReal)" stroke="#451a03" stroke-width="2"/>
          <circle cx="16" cy="16" r="4" fill="#fef08a" opacity="0.95"/>
          <circle cx="27" cy="18" r="4.5" fill="#f97316" opacity="0.9"/>
          <circle cx="21" cy="27" r="3.5" fill="#fdba74"/>
        </svg>` 
      },
      { 
        key: 'dau_ran', name: 'Đậu rán', unlockDay: 1, price: 5000, 
        iconSvg: `<svg class="w-8 h-8 food-glow" viewBox="0 0 44 44">
          <defs>
            <linearGradient id="dauReal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="40%" stop-color="#eab308"/>
              <stop offset="100%" stop-color="#854d0e"/>
            </linearGradient>
          </defs>

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-stone-900/95 text-white px-4 py-2 rounded-full border border-amber-400 shadow-xl text-xs font-bold pointer-events-none transition-all duration-300 opacity-100 translate-y-0 z-50';
      setTimeout(() => { t.className = t.className.replace('opacity-100 translate-y-0', 'opacity-0 -translate-y-2'); }, 1500);
    }

    function togglePauseGame() {
      STATE.isPaused = !STATE.isPaused;
      document.getElementById('pause-icon').textContent = STATE.isPaused ? '▶' : '⏸';
      showToast(STATE.isPaused ? 'Tạm dừng ca bán' : 'Tiếp tục bán bún');
    }

    function renderDrinkStation() {
      const d = DRINKS[STATE.currentDrinkKey];
      document.getElementById('current-drink-icon').innerHTML = d.svg;
      document.getElementById('current-drink-name').textContent = d.name;
    }

    function toggleDrinkSelector() {
      const popup = document.getElementById('drink-selector-popup');
      popup.classList.toggle('hidden');
      renderDrinkSelectionGrid();
    }

    function renderDrinkSelectionGrid() {
      const grid = document.getElementById('drinks-selection-grid');
      grid.innerHTML = '';

      for (let k in DRINKS) {
        const d = DRINKS[k];
        const isUnlocked = STATE.day >= d.unlockDay;
        const btn = document.createElement('button');

        if (isUnlocked) {
          btn.className = `p-1.5 rounded-xl border flex items-center gap-1.5 active:scale-95 transition ${
            STATE.currentDrinkKey === k ? 'bg-emerald-950 border-emerald-400' : 'bg-stone-800 border-stone-700'
          }`;
          btn.onclick = () => selectDrinkKey(k);
          btn.innerHTML = `
            ${d.svg}
            <div class="text-left">
              <span class="text-[9px] font-black text-white block">${d.name}</span>
              <span class="text-[8px] text-amber-300 font-bold">${d.price.toLocaleString('vi-VN')}đ</span>
            </div>
          `;
        } else {
          btn.className = 'p-1.5 rounded-xl border border-stone-800 bg-stone-900/60 opacity-40 flex items-center gap-1.5';
          btn.innerHTML = `
            <span class="text-sm text-stone-500">🔒</span>
            <div class="text-left">
              <span class="text-[9px] font-bold text-stone-400 block">${d.name}</span>
              <span class="text-[8px] text-amber-400 font-black">N.${d.unlockDay}</span>
            </div>
          `;
        }
        grid.appendChild(btn);
      }
    }

    function selectDrinkKey(key) {
      STATE.currentDrinkKey = key;
      STATE.currentDish.drinkKey = key;
      document.getElementById('badge-drink').classList.remove('hidden');
      document.getElementById('drink-selector-popup').classList.add('hidden');
      Sound.pour();
      renderDrinkStation();
      showToast(`Đã rót sẵn 1 ly ${DRINKS[key].name}!`);
    }

    function renderPantryRow(rowId, itemsArray) {
      const container = document.getElementById(rowId);
      container.innerHTML = '';

      itemsArray.forEach(item => {
        const isUnlocked = STATE.day >= item.unlockDay;
        const col = document.createElement('div');

        if (isUnlocked) {
          col.className = 'bg-slot-item border border-game-edge rounded-2xl p-1 flex flex-col items-center justify-between min-h-[58px] relative active:scale-90 shadow cursor-pointer';
          col.onclick = () => addTopping(item.key);
          col.innerHTML = `
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1.5 rounded-full" id="cnt-${item.key}">
              ${STATE.inventory[item.key]}
            </span>
            <div class="mt-0.5">${item.iconSvg}</div>
            <span class="text-[9px] font-black text-stone-200 mt-0.5">${item.name}</span>
          `;
        } else {
          col.className = 'bg-slot-item/40 border border-stone-800 rounded-2xl p-1 flex flex-col items-center justify-center opacity-40 min-h-[58px] shadow';
          col.innerHTML = `
            <span class="text-lg text-stone-500">🔒</span>
            <span class="text-[8px] font-bold text-stone-400 mt-1">${item.name}</span>
            <span class="text-[7px] text-amber-400 font-black">N.${item.unlockDay}</span>
          `;
        }
        container.appendChild(col);
      });
    }

    function updateHUD() {
      document.getElementById('hud-day').textContent = `Ngày ${STATE.day}`;
      document.getElementById('hud-money').textContent = STATE.cash.toLocaleString('vi-VN') + 'đ';
      document.getElementById('hud-piggy').textContent = STATE.piggyBank.toLocaleString('vi-VN') + 'đ';
      document.getElementById('hud-combo').textContent = `Combo: x${STATE.combo}`;
      document.getElementById('badge-bowls').textContent = STATE.inventory.clean_bowls;
      document.getElementById('badge-bun').textContent = STATE.inventory.bun;

      const banhDaBadge = document.getElementById('badge-banh_da');
      if (banhDaBadge) banhDaBadge.textContent = STATE.inventory.banh_da;

      const mienBadge = document.getElementById('badge-mien_dong');
      if (mienBadge) mienBadge.textContent = STATE.inventory.mien_dong;

      ALL_TOPPINGS_LIST.forEach(it => {
        const el = document.getElementById(`cnt-${it.key}`);
        if (el) el.textContent = STATE.inventory[it.key];
      });

      const m = Math.floor(STATE.timeLeft / 60), s = STATE.timeLeft % 60;
      document.getElementById('shift-clock').textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

      const titleSub = document.getElementById('shop-title-sub');
      if (STATE.day >= 25) titleSub.textContent = '👑 Nhà Hàng 5 Sao';
      else if (STATE.day >= 8) titleSub.textContent = 'Tiệm Lớn Phố Cổ';
      else if (STATE.day >= 4) titleSub.textContent = 'Quán Bún Cửa Hàng';
      else titleSub.textContent = 'Gánh Vỉa Hè';
    }

    function selectTable(idx) {
      STATE.selectedTableIdx = idx;
      renderTables();
      renderOrderBalloon();
    }

    function renderTables() {
      for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`table-slot-${i}`);
        const cust = STATE.tables[i];
        const isSelected = STATE.selectedTableIdx === i;

        if (cust) {
          slot.className = `table-slot rounded-2xl p-1 flex flex-col items-center justify-center min-h-[62px] cursor-pointer transition ${
            isSelected ? 'bg-amber-950/90 border-2 border-amber-400 shadow-md' : 'bg-stone-800 border border-stone-700'
          }`;
          slot.innerHTML = `
            <div class="relative">
              <span class="text-2xl">${cust.avatar}</span>
              ${cust.isBox ? '<span class="absolute -top-1 -right-2 text-[8px] bg-orange-600 px-1 rounded-full text-white font-black">App</span>' : ''}
              ${cust.isHotpot ? '<span class="absolute -top-1 -right-2 text-[8px] bg-red-600 px-1 rounded-full text-white font-black">Lẩu</span>' : ''}
            </div>
            <span class="text-[10px] font-black text-amber-200 mt-0.5 truncate max-w-[70px]">${cust.name}</span>
          `;
        } else {
          slot.className = `table-slot rounded-2xl p-1 flex flex-col items-center justify-center min-h-[62px] cursor-pointer transition ${
            isSelected ? 'bg-stone-900 border-2 border-amber-400/60' : 'bg-stone-800/40 border border-stone-700/40'
          }`;
          slot.innerHTML = `<span class="text-[10px] text-stone-500 font-bold">Bàn ${i+1} Trống</span>`;
        }
      }
    }

    function renderOrderBalloon() {
      const cust = STATE.tables[STATE.selectedTableIdx];
      const textEl = document.getElementById('order-dialogue-text');
      const iconEl = document.getElementById('order-bowl-icon');
      const barEl = document.getElementById('patience-bar');

      if (cust) {
        iconEl.textContent = cust.isHotpot ? '🍲' : (cust.isBox ? '🥡' : '🥣');
        textEl.innerHTML = `<b class="text-amber-300 font-extrabold">${cust.name}:</b> "${cust.dialogueText}"`;
        barEl.style.width = `${(cust.patience / cust.maxPatience) * 100}%`;
      } else {
        iconEl.textContent = '🥣';
        textEl.textContent = 'Bàn này đang trống. Hãy chọn bàn khác hoặc chờ khách ghé nhé!';
        barEl.style.width = '100%';
      }
    }

    function drawContainer(type) {
      if (STATE.currentDish.container) {
        showToast('Đã có vật chứa trên thớt rồi!');
        return;
      }
      if (type === 'bowl') {
        if (STATE.inventory.clean_bowls <= 0) {
          showToast('Hết tô sạch! Hãy vào Đi Chợ mua thêm.');
          Sound.buzz();
          return;
        }
        STATE.inventory.clean_bowls--;
      }
      STATE.currentDish.container = type;
      Sound.plop();
      updatePrepMat();
      updateHUD();
      showToast(`Đã lấy ${type === 'bowl' ? 'Tô Sứ' : (type === 'box' ? 'Hộp Mang Về' : 'Nồi Lẩu')} lên thớt!`);
    }

    function selectNoodle(type) {
      if (!STATE.currentDish.container) { showToast('Lấy tô trước khi chọn sợi!'); Sound.buzz(); return; }
      if (STATE.currentDish.base) { showToast('Đã có sợi trong tô rồi!'); return; }
      if (STATE.inventory[type] <= 0) { showToast('Đã hết loại sợi này trong kho!'); Sound.buzz(); return; }
      STATE.inventory[type]--;
      STATE.currentDish.base = type;
      Sound.plop();
      updatePrepMat();
      updateHUD();
    }

    function addBroth() {
      if (!STATE.currentDish.container) { showToast('Lấy tô trước khi chan nước!'); Sound.buzz(); return; }
      if (!STATE.currentDish.base) { showToast('Cho sợi vào tô trước đã!'); Sound.buzz(); return; }
      if (STATE.currentDish.hasBroth) { showToast('Tô đã chan đầy nước dùng rồi!'); return; }
      STATE.currentDish.hasBroth = true;
      Sound.pour();
      updatePrepMat();
    }

    function addTopping(k) {
      if (!STATE.currentDish.container) { showToast('Lấy tô trước khi gắp topping!'); Sound.buzz(); return; }
      if (!STATE.currentDish.base) { showToast('Cho sợi vào trước đã!'); Sound.buzz(); return; }
      if (STATE.inventory[k] <= 0) { showToast('Đã hết món này trong kho!'); Sound.buzz(); return; }
      STATE.inventory[k]--;
      STATE.currentDish.toppings.push(k);
      Sound.plop();
      updatePrepMat();
      updateHUD();
    }

    function addShrimpPaste() {
      if (!STATE.currentDish.container) return;
      STATE.currentDish.hasShrimpPaste = true;
      document.getElementById('badge-shrimp').classList.remove('hidden');
      Sound.plop();
      showToast('Đã thêm 1 thìa Mắm tôm bông xốp!');
    }

    function addChiliSauce() {
      if (!STATE.currentDish.container) return;
      STATE.currentDish.hasChili = true;
      document.getElementById('badge-chili').classList.remove('hidden');
      Sound.plop();
      showToast('Đã thêm Ớt chưng cay nồng!');
    }

    function trashDish() {
      if (STATE.currentDish.container === 'bowl') STATE.inventory.clean_bowls++;
      STATE.currentDish = { container: null, base: null, hasBroth: false, toppings: [], drinkKey: null, hasShrimpPaste: false, hasChili: false };
      document.getElementById('badge-drink').classList.add('hidden');
      document.getElementById('badge-shrimp').classList.add('hidden');
      document.getElementById('badge-chili').classList.add('hidden');
      Sound.plop();
      updatePrepMat();
      updateHUD();
      showToast('Đã dọn sạch thớt chế biến!');
    }

    function updatePrepMat() {
      const promptEl = document.getElementById('prep-prompt');
      const visualEl = document.getElementById('visual-dish');
      const brothEl = document.getElementById('visual-broth');
      const noodleEl = document.getElementById('visual-noodle-layer');
      const topsEl = document.getElementById('visual-toppings-layer');

      if (!STATE.currentDish.container) {
        promptEl.classList.remove('hidden');
        visualEl.classList.add('hidden');
        return;
      }

      promptEl.classList.add('hidden');
      visualEl.classList.remove('hidden');

      if (STATE.currentDish.hasBroth) brothEl.classList.remove('hidden');
      else brothEl.classList.add('hidden');

      if (STATE.currentDish.base === 'bun') {
        noodleEl.innerHTML = `<svg class="w-full h-full" viewBox="0 0 100 100"><path d="M12 35 Q50 68 88 35 M15 50 Q50 82 85 50 M12 65 Q50 98 88 65" stroke="#f1f5f9" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
      } else if (STATE.currentDish.base === 'banh_da') {
        noodleEl.innerHTML = `<svg class="w-full h-full" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#3f1301"/><line x1="16" y1="26" x2="84" y2="26" stroke="#881337" stroke-width="8" stroke-linecap="round"/><line x1="10" y1="46" x2="90" y2="46" stroke="#9f1239" stroke-width="8" stroke-linecap="round"/></svg>`;
      } else if (STATE.currentDish.base === 'mien_dong') {
        noodleEl.innerHTML = `<svg class="w-full h-full" viewBox="0 0 100 100"><path d="M14 30 Q50 60 86 30 M16 48 Q50 78 84 48 M14 66 Q50 96 86 66" stroke="#94a3b8" stroke-width="3" fill="none" opacity="0.85" stroke-linecap="round"/></svg>`;
      } else {
        noodleEl.innerHTML = '';
      }

      topsEl.innerHTML = '';
      STATE.currentDish.toppings.forEach(tKey => {
        const span = document.createElement('div');
        span.className = 'drop-item p-0.5 rounded-full flex items-center justify-center';
        const item = ALL_TOPPINGS_LIST.find(t => t.key === tKey);
        span.innerHTML = item ? item.iconSvg : '';
        topsEl.appendChild(span);
      });
    }

    function serveCurrentDish() {
      const cust = STATE.tables[STATE.selectedTableIdx];
      if (!cust) { showToast('Bàn này không có khách để giao!'); Sound.buzz(); return; }
      if (!STATE.currentDish.container) { showToast('Chưa nấu món nào trên thớt!'); Sound.buzz(); return; }

      const dish = STATE.currentDish;

      if (cust.isHotpot && dish.container !== 'hotpot') {
        showToast('Khách gọi Nồi Lẩu VIP, phải dùng Nồi Lẩu!'); Sound.buzz(); return;
      }
      if (cust.isBox && dish.container !== 'box') {
        showToast('Đơn mang đi, phải dùng Hộp về 🥡!'); Sound.buzz(); return;
      }
      if (!cust.isHotpot && !cust.isBox && dish.container !== 'bowl') {
        showToast('Khách ăn tại quán phải múc vào Tô sứ 🥣!'); Sound.buzz(); return;
      }

      if (dish.base !== cust.base) {
        const baseMap = { bun: 'Bún', banh_da: 'Bánh đa', mien_dong: 'Miến' };
        showToast(`Khách gọi ${baseMap[cust.base]}, bạn làm nhầm sợi rồi!`); Sound.buzz(); return;
      }
      if (!dish.hasBroth) { showToast('Quên chưa chan nước dùng vào tô!'); Sound.buzz(); return; }

      if (cust.needDrinkKey && dish.drinkKey !== cust.needDrinkKey) {
        showToast(`Khách gọi thêm ly ${DRINKS[cust.needDrinkKey].name}!`); Sound.buzz(); return;
      }
      if (cust.needShrimp && !dish.hasShrimpPaste) {
        showToast('Khách dặn thêm một thìa Mắm tôm!'); Sound.buzz(); return;
      }

      for (let req of cust.tops) {
        if (!dish.toppings.includes(req)) {
          const found = ALL_TOPPINGS_LIST.find(t => t.key === req);
          showToast(`Tô còn thiếu: ${found ? found.name : req}!`); Sound.buzz(); return;
        }
      }

      Sound.coin();
      STATE.cash += cust.price;
      STATE.combo++;
      if (dish.container === 'bowl') STATE.inventory.clean_bowls++;

      showToast(`+${cust.price.toLocaleString('vi-VN')}đ! ${cust.name} khen ngon chuẩn vị!`);
      STATE.tables[STATE.selectedTableIdx] = null;
      trashDish();
      renderTables();
      renderOrderBalloon();
      updateHUD();
    }

    /* SINH KHÁCH THEO ĐÚNG TIẾN TRÌNH UNLOCK (CHỈ MỞ ĐƠN ONLINE TỪ NGÀY 3) */
    function spawnCustomer() {
      if (STATE.isPaused) return;
      const emptyIdx = STATE.tables.findIndex(t => t === null);
      if (emptyIdx === -1) return;

      // 1. Lọc loại Sợi theo Ngày mở khóa
      const availBases = ['bun'];
      if (STATE.day >= 4) availBases.push('banh_da');
      if (STATE.day >= 7) availBases.push('mien_dong');
      const chosenBase = availBases[Math.floor(Math.random() * availBases.length)];

      // 2. Lọc Topping đã mở khóa
      const unlockedToppings = ALL_TOPPINGS_LIST.filter(t => STATE.day >= t.unlockDay);

      let toppingCount = 2;
      if (STATE.day >= 8) toppingCount = 3;
      if (STATE.day >= 15) toppingCount = 4;

      const chosenTops = [];
      const shuffled = [...unlockedToppings].sort(() => 0.5 - Math.random());
      for (let i = 0; i < Math.min(toppingCount, shuffled.length); i++) {
        chosenTops.push(shuffled[i].key);
      }

      if (!chosenTops.includes('rieu_cua') && Math.random() < 0.7) {
        chosenTops[0] = 'rieu_cua';
      }

      // 3. Lọc Đồ uống đã mở khóa
      const unlockedDrinkKeys = Object.keys(DRINKS).filter(k => STATE.day >= DRINKS[k].unlockDay);
      let chosenDrinkKey = null;
      if (Math.random() < 0.45 && unlockedDrinkKeys.length > 0) {
        chosenDrinkKey = unlockedDrinkKeys[Math.floor(Math.random() * unlockedDrinkKeys.length)];
      }

      const needShrimp = Math.random() < 0.35;

      // 4. KIỂM TRA ĐIỀU KIỆN ĐƠN ONLINE: CHỈ MỞ TỪ NGÀY 3 TRỞ ĐI
      let isBox = false;
      let isHotpot = false;
      if (STATE.day >= 25 && Math.random() < 0.2) {
        isHotpot = true;
      } else if (STATE.day >= 3) {
        isBox = Math.random() < 0.35; // Ngày 3 trở đi mới nổ đơn mang đi!
      }

      let totalPrice = 25000;
      chosenTops.forEach(tk => {
        const item = ALL_TOPPINGS_LIST.find(t => t.key === tk);
        if (item) totalPrice += item.price;
      });
      if (chosenDrinkKey) totalPrice += DRINKS[chosenDrinkKey].price;
      if (needShrimp) totalPrice += 3000;
      if (isBox) totalPrice += 10000;
      if (isHotpot) totalPrice = Math.round(totalPrice * 2.2);

      const namesPool = [
        { name: 'Bà Lam', avatar: '👵' },
        { name: 'Anh Nam', avatar: '👨‍💼' },
        { name: 'Cô Mai', avatar: '👩‍🦰' },
        { name: 'Bác Tư', avatar: '👴' },
        { name: 'Em Sinh Viên', avatar: '👱‍♂️' }
      ];
      const customerIdentity = isBox 
        ? { name: 'Shipper Shopee', avatar: '🛵' } 
        : (isHotpot ? { name: 'Gia Đình Đặt Lẩu', avatar: '👨‍👩‍👧‍👦' } : namesPool[Math.floor(Math.random() * namesPool.length)]);

      const baseNameMap = { bun: 'bún riêu', banh_da: 'bánh đa đỏ', mien_dong: 'miến dong riêu cua' };
      const baseName = baseNameMap[chosenBase];
      const topsTextList = chosenTops.map(tk => {
        const item = ALL_TOPPINGS_LIST.find(t => t.key === tk);
        return `<b class="text-amber-300">${item.name}</b>`;
      }).join(' + ');

      let dialogue = '';
      if (isHotpot) {
        dialogue = `1 Nồi Lẩu Riêu Cua sum vầy: ${topsTextList}`;
      } else if (isBox) {
        dialogue = `Đơn hộp mang đi: 1 suất ${baseName} + ${topsTextList}`;
      } else {
        dialogue = `Cho mình 1 tô ${baseName} + ${topsTextList}`;
      }

      if (needShrimp) dialogue += ` + <b class="text-purple-300">mắm tôm</b>`;
      if (chosenDrinkKey) dialogue += ` + 1 ly <b class="text-emerald-300">${DRINKS[chosenDrinkKey].name}</b>`;
      dialogue += ` nha!`;

      STATE.tables[emptyIdx] = {
        name: customerIdentity.name,
        avatar: customerIdentity.avatar,
        dialogueText: dialogue,
        base: chosenBase,
        tops: chosenTops,
        needDrinkKey: chosenDrinkKey,
        needShrimp: needShrimp,
        isBox: isBox,
        isHotpot: isHotpot,
        price: totalPrice,
        patience: isBox ? 30 : 42,
        maxPatience: isBox ? 30 : 42
      };

      renderTables();
      if (STATE.selectedTableIdx === emptyIdx) renderOrderBalloon();
    }

    /* MODAL TIỆN ÍCH */
    function openModal(type) {
      const container = document.getElementById('modal-container');
      const title = document.getElementById('modal-title');
      const content = document.getElementById('modal-content');
      container.classList.remove('hidden');

      if (type === 'market') {
        title.textContent = '🛒 Chợ Đầu Mối Cua Cá';
        content.innerHTML = `
          <div class="p-2.5 bg-stone-800 rounded-xl border border-stone-700 flex justify-between items-center mb-1.5">
            <div><b>Tô bát sứ sạch:</b> ${STATE.inventory.clean_bowls} cái</div>
            <button onclick="buyMarket('clean_bowls', 10, 10000)" class="bg-amber-600 text-white font-bold px-3 py-1 rounded-lg">Mua +10 (10k)</button>
          </div>
          <div class="p-2.5 bg-stone-800 rounded-xl border border-stone-700 flex justify-between items-center mb-1.5">
            <div><b>Gạch riêu cua:</b> ${STATE.inventory.rieu_cua} phần</div>
            <button onclick="buyMarket('rieu_cua', 10, 40000)" class="bg-amber-600 text-white font-bold px-3 py-1 rounded-lg">Mua +10 (40k)</button>
          </div>
          <div class="p-2.5 bg-stone-800 rounded-xl border border-stone-700 flex justify-between items-center">
            <div><b>Miến dong sợi dai:</b> ${STATE.inventory.mien_dong} phần</div>
            <button onclick="buyMarket('mien_dong', 10, 25000)" class="bg-amber-600 text-white font-bold px-3 py-1 rounded-lg">Mua +10 (25k)</button>
          </div>
        `;
      } else if (type === 'shop') {
        title.textContent = '👥 Thuê Nhân Sự & Tiến Trình';
        content.innerHTML = `
          <div class="p-3 bg-stone-800 rounded-xl border border-stone-700 mb-2">
            <b>👧 Bé Na Rửa Bát & Dọn Bàn:</b> Tự động rửa sạch bát cất lại kho khi khách ăn xong.
            <button onclick="showToast('Bé Na đã vào ca dọn bàn!'); closeModal();" class="mt-2 w-full bg-yellow-500 text-stone-950 font-black py-2 rounded-xl">Thuê Bé Na (Đã có sẵn)</button>
          </div>
          <div class="p-3 bg-stone-800 rounded-xl border border-stone-700">
            <b>🗓️ Sang ngày tiếp theo:</b> Mở khóa Đơn mang về (N.3), Bánh đa (N.4), Trà tắc (N.6), Miến dong (N.7)...
            <button onclick="advanceNextDay(); closeModal();" class="mt-2 w-full bg-emerald-600 text-white font-black py-2 rounded-xl">Qua Ngày Mới (+1 Ngày)</button>
          </div>
        `;
      } else if (type === 'hui') {
        title.textContent = '🤝 Hốt Hụi Phường Chợ';
        content.innerHTML = `
          <p class="text-stone-300 mb-3">Bốc ngay một bát họ <b>2.000.000đ</b> tiền mặt để lấy vốn nhập hàng!</p>
          <button onclick="STATE.cash += 2000000; updateHUD(); closeModal(); showToast('+2.000.000đ tiền hụi đã vào két!'); Sound.coin();" class="w-full bg-yellow-500 text-stone-950 font-black py-2.5 rounded-xl">HỐT HỤI 2.000.000đ</button>
        `;
      } else if (type === 'piggy') {
        title.textContent = '🐷 Nuôi Heo Mua Nhà Phố Cổ';
        content.innerHTML = `
          <div class="text-center p-3 bg-stone-800 rounded-2xl border border-stone-700">
            <div class="text-4xl mb-1">🏛️</div>
            <div class="text-amber-300 font-bold mb-1">Mua Đứt Căn Nhà Mặt Phố Hàng Bè</div>
            <div class="text-xs text-stone-300">Đã tích lũy trong heo: <b class="text-pink-400">${STATE.piggyBank.toLocaleString('vi-VN')}đ</b> / 200.000.000đ</div>
          </div>
        `;
      }
    }

    function advanceNextDay() {
      STATE.day++;
      STATE.timeLeft = 180;
      renderPantry();
      renderDrinkStation();
      updateHUD();
      showToast(`🎉 ĐÃ BƯỚC SANG NGÀY ${STATE.day}! Kiểm tra các món mới mở khóa nhé.`);
    }

    function buyMarket(k, qty, cost) {
      if (STATE.cash < cost) { showToast('Không đủ tiền trong két!'); Sound.buzz(); return; }
      STATE.cash -= cost;
      STATE.inventory[k] += qty;
      Sound.coin();
      updateHUD();
      openModal('market');
      renderPantry();
      showToast('Đã nhập hàng thành công!');
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('click', () => Sound.init(), { once: true });
      renderPantry();
      renderDrinkStation();
      updateHUD();
      renderTables();
      renderOrderBalloon();
      updatePrepMat();

      // Bàn 1 có khách mở hàng chuẩn món Ngày 1 (Bún riêu + Đậu rán + Rau muống + Trà đá)
      STATE.tables[0] = {
        name: 'Bà Lam', avatar: '👵',
        dialogueText: 'Cho bà 1 tô bún riêu + <b class="text-amber-300">Gạch riêu</b> + <b class="text-amber-300">Đậu rán</b> + <b class="text-amber-300">Rau muống</b> + ly <b class="text-emerald-300">Trà Đá</b> nha!',
        base: 'bun', tops: ['rieu_cua', 'dau_ran', 'rau_song'],
        needDrinkKey: 'tea',
        needShrimp: false,
        isBox: false,
        isHotpot: false,
        price: 43000,
        patience: 38,
        maxPatience: 40
      };
      renderTables();
      renderOrderBalloon();

      setInterval(() => {
        if (!STATE.isPaused && STATE.timeLeft > 0) {
          STATE.timeLeft--;
          updateHUD();
        }
      }, 1000);

      setInterval(spawnCustomer, 4500);

      setInterval(() => {
        if (STATE.isPaused) return;
        for (let i = 0; i < 3; i++) {
          const c = STATE.tables[i];
          if (c) {
            c.patience -= 0.4;
            if (c.patience <= 0) {
              STATE.tables[i] = null;
              STATE.combo = 0;
              showToast(`Khách ở bàn ${i+1} đợi lâu quá nên đã về!`);
              renderTables();
              if (STATE.selectedTableIdx === i) renderOrderBalloon();
            }
          }
        }
        if (STATE.tables[STATE.selectedTableIdx]) renderOrderBalloon();
      }, 500);
    });
  </script>
</body>
