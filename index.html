<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bún Riêu Cô Ba - Chuẩn Layout Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      user-select: none; 
      -webkit-user-select: none; 
      touch-action: manipulation;
      background-color: #120508;
    }
    .brand-font { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; }

    /* Bảng màu chuẩn theo game mẫu */
    .bg-game-main { background-color: #271017; }
    .bg-game-card { background-color: #3b1924; }
    .bg-game-slot { background-color: #4a212f; }
    .border-game { border-color: #5d2b3c; }

    @keyframes dropIn {
      0% { transform: scale(0.4) translateY(-15px); opacity: 0; }
      70% { transform: scale(1.1) translateY(2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .drop-item { animation: dropIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    @keyframes slurpAnim {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08) translateY(-4px); }
    }
    .slurping-eating { animation: slurpAnim 0.35s infinite ease-in-out; }

    .food-shadow { filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="min-h-screen flex justify-center items-center p-0 sm:py-2">
  <div id="game-app" class="w-full max-w-[430px] h-[100dvh] sm:h-[880px] bg-game-main text-stone-100 flex flex-col justify-between shadow-2xl relative overflow-hidden sm:rounded-[36px] sm:border-[6px] sm:border-stone-800">
    
    <!-- 1. TOP HEADER THEO ẢNH MẪU -->
    <header class="pt-3 px-4 pb-2 z-20 flex items-center justify-between border-b border-game">
      <!-- Cột trái: Pause & Ngày giờ -->
      <div class="flex items-center gap-2">
        <button onclick="togglePauseGame()" class="text-amber-200 font-black text-sm bg-game-card w-8 h-8 rounded-xl border border-game flex items-center justify-center active:scale-95">
          <span id="pause-icon">⏸</span>
        </button>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-sm font-black text-white" id="hud-day">Ngày 1</span>
            <span class="text-[10px] bg-amber-500/20 text-amber-300 font-bold px-1.5 py-0.2 rounded" id="shift-clock">03:00</span>
          </div>
          <div class="text-[10px] text-stone-400 font-semibold" id="shop-title-sub">Gánh Vỉa Hè</div>
        </div>
      </div>

      <!-- Cột giữa: Két tiền -->
      <div class="text-center">
        <div class="text-[10px] font-black uppercase tracking-widest text-amber-300/80">KÉT</div>
        <div class="font-mono text-sm sm:text-base font-black text-amber-300" id="hud-money">300.000đ</div>
      </div>

      <!-- Cột phải: Đánh giá sao & Heo đất -->
      <div class="flex items-center gap-1.5 text-right">
        <div class="cursor-pointer bg-game-card px-2 py-1 rounded-xl border border-game" onclick="switchTab('piggy')">
          <div class="text-amber-300 text-xs font-black">★★★★★</div>
          <div class="text-[9px] text-stone-300 font-bold" id="hud-piggy">Heo: 0đ</div>
        </div>
      </div>
    </header>

    <!-- 2. KHU VỰC QUÁN ĂN (MÁI HIÊN, BẢNG HIỆU & 3 BÀN KHÁCH) -->
    <section class="px-3 pt-1 flex flex-col gap-1.5">
      <!-- Mái hiên và Bảng hiệu tiệm -->
      <div class="relative bg-gradient-to-b from-rose-900 to-amber-950 rounded-2xl pt-2 pb-2.5 px-3 border border-amber-600/40 shadow-md">
        <!-- Rèm mái che cong -->
        <div class="absolute -top-1 left-0 right-0 flex justify-around overflow-hidden h-2.5 pointer-events-none opacity-80">
          <div class="w-7 h-3 bg-red-600 rounded-b-full shadow"></div>
          <div class="w-7 h-3 bg-amber-100 rounded-b-full shadow"></div>
          <div class="w-7 h-3 bg-red-600 rounded-b-full shadow"></div>
          <div class="w-7 h-3 bg-amber-100 rounded-b-full shadow"></div>
          <div class="w-7 h-3 bg-red-600 rounded-b-full shadow"></div>
          <div class="w-7 h-3 bg-amber-100 rounded-b-full shadow"></div>
        </div>

        <div class="bg-stone-950/80 border border-amber-500/60 rounded-xl py-1 px-3 text-center mx-auto max-w-[200px] shadow">
          <div class="text-xs font-black text-amber-300 tracking-wide">Bún riêu Cô Ba</div>
          <div class="text-[9px] font-bold text-amber-100 uppercase tracking-widest">ĐỆ NHẤT BÚN RIÊU</div>
        </div>

        <!-- 3 Bàn khách ngồi (theo layout mẫu) -->
        <div class="grid grid-cols-3 gap-2 mt-2" id="tables-row">
          <!-- Bàn 1 -->
          <div id="table-slot-0" onclick="selectTable(0)" class="table-slot bg-game-card/80 border border-game rounded-2xl p-1.5 flex flex-col items-center justify-center min-h-[64px] cursor-pointer transition active:scale-95">
            <span class="text-xs text-stone-500 font-bold">Bàn trống</span>
          </div>
          <!-- Bàn 2 -->
          <div id="table-slot-1" onclick="selectTable(1)" class="table-slot bg-game-card/80 border border-game rounded-2xl p-1.5 flex flex-col items-center justify-center min-h-[64px] cursor-pointer transition active:scale-95">
            <span class="text-xs text-stone-500 font-bold">Bàn trống</span>
          </div>
          <!-- Bàn 3 -->
          <div id="table-slot-2" onclick="selectTable(2)" class="table-slot bg-game-card/80 border border-game rounded-2xl p-1.5 flex flex-col items-center justify-center min-h-[64px] cursor-pointer transition active:scale-95">
            <span class="text-xs text-stone-500 font-bold">Bàn trống</span>
          </div>
        </div>
      </div>

      <!-- BONG BÓNG LỜI THOẠI & ĐƠN HÀNG (ORDER BALLOON) -->
      <div id="order-balloon" class="bg-game-card border border-game rounded-2xl p-2.5 shadow-md flex flex-col gap-1.5">
        <div class="flex items-center gap-2.5">
          <div class="w-11 h-11 bg-game-slot rounded-xl border border-game flex items-center justify-center text-2xl flex-shrink-0" id="order-bowl-icon">
            🥣
          </div>
          <div class="flex-1 text-xs text-stone-200 leading-snug" id="order-dialogue-text">
            Chưa có khách gọi món. Hãy chờ khách vào bàn nhé con!
          </div>
        </div>
        <!-- Thanh kiên nhẫn màu xanh lá chạy ngay dưới lời thoại -->
        <div class="w-full bg-stone-900 h-1.5 rounded-full overflow-hidden">
          <div id="patience-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
        </div>
      </div>
    </section>

    <!-- 3. KHU CHẾ BIẾN BẾP (KITCHEN WORKSPACE) -->
    <main class="flex-1 flex flex-col justify-between px-3 py-1 gap-1.5">
      
      <!-- HÀNG 1: CHỒNG TÔ & CÁC NỒI NƯỚC DÙNG -->
      <div class="grid grid-cols-5 gap-1.5">
        <!-- Chồng tô -->
        <button onclick="drawContainer('bowl')" class="bg-game-card border border-game rounded-2xl p-1 flex flex-col items-center justify-center relative active:scale-95">
          <span id="badge-bowls" class="absolute -top-1 -right-1 bg-red-600 text-white font-black text-[9px] px-1.5 rounded-full">20</span>
          <span class="text-xl">🥣</span>
          <span class="text-[9px] font-black text-stone-300 mt-0.5">Lấy tô</span>
        </button>

        <!-- Hộp App Mang Về -->
        <button onclick="drawContainer('box')" class="bg-game-card border border-game rounded-2xl p-1 flex flex-col items-center justify-center relative active:scale-95">
          <span class="text-xl">🥡</span>
          <span class="text-[9px] font-black text-orange-300 mt-0.5">Hộp về</span>
        </button>

        <!-- Nồi Riêu Cua Đồng -->
        <button onclick="addBroth('rieu_cua')" class="bg-game-card border-2 border-amber-500/70 rounded-2xl p-1 flex flex-col items-center justify-center relative active:scale-95">
          <span class="text-xl">🍲</span>
          <span class="text-[9px] font-black text-amber-300 mt-0.5">Nước cua</span>
        </button>

        <!-- Nồi Lẩu Thái Cua (Mở theo cấp) -->
        <button onclick="drawContainer('hotpot')" class="bg-game-card border border-game rounded-2xl p-1 flex flex-col items-center justify-center relative active:scale-95">
          <span class="absolute -top-1 -right-1 bg-red-500 text-white font-black text-[8px] px-1 rounded-full">VIP</span>
          <span class="text-xl">🥘</span>
          <span class="text-[9px] font-black text-rose-300 mt-0.5">Nồi lẩu</span>
        </button>

        <!-- Quầy Trà Đá / Trà Tắc -->
        <button onclick="pourDrink()" class="bg-game-card border border-emerald-500/50 rounded-2xl p-1 flex flex-col items-center justify-center relative active:scale-95">
          <span id="badge-drink" class="hidden absolute -top-1 -right-1 bg-emerald-400 text-stone-950 font-black text-[8px] px-1 rounded-full">✓</span>
          <span class="text-xl">🧊</span>
          <span class="text-[9px] font-black text-emerald-300 mt-0.5">Trà đá</span>
        </button>
      </div>

      <!-- HÀNG 2: BÀN TRẦN SỢI (TRÁI) - THỚT NẤU TRUNG TÂM - LỌ MẮM TÔM/ỚT (PHẢI) -->
      <div class="grid grid-cols-12 gap-2 items-center">
        <!-- Cột trái: Nồi trần sợi & Rổ bún chín -->
        <div class="col-span-3 flex flex-col gap-1.5">
          <button onclick="selectNoodle('bun')" class="bg-game-card border border-game rounded-2xl p-1.5 flex flex-col items-center justify-center relative active:scale-95">
            <span class="text-2xl">🍜</span>
            <span class="text-[9px] font-black text-stone-200 mt-0.5">Bún trắng</span>
            <span id="badge-bun" class="text-[8px] font-black text-amber-400">15</span>
          </button>

          <button onclick="selectNoodle('banh_da')" class="bg-game-card border border-game rounded-2xl p-1.5 flex flex-col items-center justify-center relative active:scale-95">
            <span class="text-2xl">🥢</span>
            <span class="text-[9px] font-black text-red-300 mt-0.5">Bánh đa</span>
            <span id="badge-banh_da" class="text-[8px] font-black text-amber-400">15</span>
          </button>
        </div>

        <!-- Ở giữa: Thớt nấu trung tâm (Prep Mat) -->
        <div class="col-span-6 bg-amber-950/40 border-2 border-amber-600/50 rounded-3xl p-2.5 h-[155px] flex flex-col items-center justify-center relative shadow-inner overflow-hidden" id="prep-mat">
          <div id="prep-prompt" class="text-stone-400 text-center text-xs font-bold leading-relaxed">
            Chưa có tô.<br><span class="text-amber-400">Chạm chồng tô</span> để lấy.
          </div>

          <!-- Lớp hiển thị tô và món -->
          <div id="visual-dish" class="hidden relative w-32 h-32 rounded-full border-4 border-blue-900 bg-white/95 flex items-center justify-center overflow-hidden shadow-lg">
            <div id="visual-broth" class="hidden absolute inset-0 bg-gradient-to-t from-red-600/80 via-orange-500/60 to-amber-400/40 z-10 pointer-events-none"></div>
            <div id="visual-noodle-layer" class="absolute inset-1 flex items-center justify-center text-3xl z-0">🍜</div>
            <div id="visual-toppings-layer" class="absolute inset-0 p-2 flex flex-wrap items-center justify-center gap-1 z-20 pointer-events-none"></div>
          </div>
        </div>

        <!-- Cột phải: Hũ Mắm tôm & Sa tế ớt chưng -->
        <div class="col-span-3 flex flex-col gap-1.5">
          <button onclick="addShrimpPaste()" class="bg-game-card border border-purple-500/60 rounded-2xl p-1.5 flex flex-col items-center justify-center relative active:scale-95">
            <span id="badge-shrimp" class="hidden absolute -top-1 -right-1 bg-purple-400 text-stone-950 font-black text-[8px] px-1 rounded-full">✓</span>
            <span class="text-2xl">🫙</span>
            <span class="text-[9px] font-black text-purple-300 mt-0.5">Mắm tôm</span>
          </button>

          <button onclick="addChiliSauce()" class="bg-game-card border border-red-500/60 rounded-2xl p-1.5 flex flex-col items-center justify-center relative active:scale-95">
            <span id="badge-chili" class="hidden absolute -top-1 -right-1 bg-red-400 text-white font-black text-[8px] px-1 rounded-full">✓</span>
            <span class="text-2xl">🌶️</span>
            <span class="text-[9px] font-black text-red-400 mt-0.5">Ớt sa tế</span>
          </button>
        </div>
      </div>

      <!-- HÀNG 3: NÚT GIAO MÓN TO XANH LÁ & ĐỔ TÔ -->
      <div class="flex items-center gap-2">
        <button onclick="serveCurrentDish()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-2.5 rounded-2xl shadow-lg border border-emerald-400 flex items-center justify-center gap-2 text-sm">
          <span>🛎️</span>
          <span>Giao món</span>
        </button>
        <button onclick="trashDish()" class="bg-game-card border border-red-500/40 hover:bg-red-950/60 active:scale-95 text-red-400 font-bold px-3 py-2.5 rounded-2xl text-xs flex items-center gap-1">
          <span>🗑️</span>
          <span>Đổ tô</span>
        </button>
      </div>

      <!-- HÀNG 4 & 5: KHAY TOPPING 2 HÀNG BO GÓC CHUẨN ẢNH MẪU -->
      <div class="bg-game-card rounded-2xl p-1.5 border border-game shadow-md">
        <!-- Hàng topping 1 -->
        <div class="grid grid-cols-7 gap-1 mb-1">
          <!-- Gạch cua -->
          <button onclick="addTopping('rieu_cua')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-rieu_cua">15</span>
            <span class="text-base">🦀</span>
            <span class="text-[8px] font-black text-stone-200">Gạch riêu</span>
          </button>
          <!-- Đậu rán -->
          <button onclick="addTopping('dau_ran')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-dau_ran">15</span>
            <span class="text-base">🧈</span>
            <span class="text-[8px] font-black text-stone-200">Đậu rán</span>
          </button>
          <!-- Tiết luộc -->
          <button onclick="addTopping('tiet_luoc')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-tiet_luoc">15</span>
            <span class="text-base">🩸</span>
            <span class="text-[8px] font-black text-stone-200">Tiết luộc</span>
          </button>
          <!-- Trứng vịt lộn -->
          <button onclick="addTopping('trung_lon')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-trung_lon">10</span>
            <span class="text-base">🥚</span>
            <span class="text-[8px] font-black text-stone-200">Trứng lộn</span>
          </button>
          <!-- Chả cá -->
          <button onclick="addTopping('cha_ca')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-cha_ca">15</span>
            <span class="text-base">🐟</span>
            <span class="text-[8px] font-black text-stone-200">Chả cá</span>
          </button>
          <!-- Mọc nấm -->
          <button onclick="addTopping('moc_nam')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-moc_nam">15</span>
            <span class="text-base">🧆</span>
            <span class="text-[8px] font-black text-stone-200">Mọc nấm</span>
          </button>
          <!-- Ốc bươu -->
          <button onclick="addTopping('oc')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-oc">15</span>
            <span class="text-base">🐌</span>
            <span class="text-[8px] font-black text-stone-200">Ốc bươu</span>
          </button>
        </div>

        <!-- Hàng topping 2 -->
        <div class="grid grid-cols-7 gap-1">
          <!-- Bắp bò hoa -->
          <button onclick="addTopping('bap_bo')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-bap_bo">15</span>
            <span class="text-base">🥩</span>
            <span class="text-[8px] font-black text-stone-200">Bắp bò</span>
          </button>
          <!-- Sườn sụn -->
          <button onclick="addTopping('suon_sun')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-suon_sun">15</span>
            <span class="text-base">🥓</span>
            <span class="text-[8px] font-black text-stone-200">Sườn sụn</span>
          </button>
          <!-- Chả lá lốt -->
          <button onclick="addTopping('cha_la_lot')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-cha_la_lot">15</span>
            <span class="text-base">🌯</span>
            <span class="text-[8px] font-black text-stone-200">Lá lốt</span>
          </button>
          <!-- Rau muống -->
          <button onclick="addTopping('rau_song')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-rau_song">15</span>
            <span class="text-base">🥬</span>
            <span class="text-[8px] font-black text-stone-200">Rau sống</span>
          </button>
          <!-- Quẩy giòn -->
          <button onclick="addTopping('quay')" class="bg-game-slot border border-game rounded-xl p-1 flex flex-col items-center justify-between min-h-[50px] relative active:scale-90">
            <span class="absolute -top-1 -right-1 bg-stone-900 border border-stone-700 text-amber-300 font-black text-[8px] px-1 rounded-full" id="cnt-quay">15</span>
            <span class="text-base">🥖</span>
            <span class="text-[8px] font-black text-stone-200">Quẩy giòn</span>
          </button>
          <!-- Nấm hương (Khóa) -->
          <div class="bg-game-slot/40 border border-stone-800 rounded-xl p-1 flex flex-col items-center justify-center opacity-40">
            <span class="text-base">🔒</span>
            <span class="text-[8px] font-bold text-stone-500">Nấm</span>
          </div>
          <!-- Bò viên (Khóa) -->
          <div class="bg-game-slot/40 border border-stone-800 rounded-xl p-1 flex flex-col items-center justify-center opacity-40">
            <span class="text-base">🔒</span>
            <span class="text-[8px] font-bold text-stone-500">Bò viên</span>
          </div>
        </div>
      </div>

    </main>

    <!-- 4. THANH TIỆN ÍCH DƯỚI CÙNG: ĐI CHỢ - THUÊ NGƯỜI - HỦ HEO -->
    <footer class="bg-stone-950/95 border-t border-game py-2 px-4 flex justify-around items-center z-30">
      <button onclick="openModal('market')" class="flex flex-col items-center text-xs text-amber-300 font-bold active:scale-95">
        <span class="text-lg">🛒</span>
        <span>Đi chợ</span>
      </button>
      <button onclick="openModal('shop')" class="flex flex-col items-center text-xs text-stone-400 font-bold active:scale-95">
        <span class="text-lg">👥</span>
        <span>Thuê người</span>
      </button>
      <button onclick="openModal('hui')" class="flex flex-col items-center text-xs text-stone-400 font-bold active:scale-95">
        <span class="text-lg">🤝</span>
        <span>Hốt hụi</span>
      </button>
      <button onclick="openModal('piggy')" class="flex flex-col items-center text-xs text-stone-400 font-bold active:scale-95">
        <span class="text-lg">🐷</span>
        <span>Nuôi heo</span>
      </button>
    </footer>

    <!-- POPUP MODAL ĐI CHỢ & NÂNG CẤP -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3">
      <div class="bg-game-main border-2 border-amber-600 rounded-3xl max-w-sm w-full p-4 flex flex-col gap-3 shadow-2xl max-h-[85vh]">
        <div class="flex justify-between items-center border-b border-game pb-2">
          <h3 id="modal-title" class="text-base font-black text-amber-300 uppercase">TIÊU ĐỀ</h3>
          <button onclick="closeModal()" class="w-7 h-7 bg-game-card rounded-full text-stone-300 font-black">✕</button>
        </div>
        <div id="modal-content" class="flex-1 overflow-y-auto no-scrollbar space-y-2 text-xs"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-stone-900/95 text-white px-4 py-2 rounded-full border border-amber-400 shadow-xl text-xs font-bold pointer-events-none transition-all duration-300 opacity-0 -translate-y-2 z-50">
      Thông báo
    </div>
  </div>

  <script>
    /* ÂM THANH ASMR */
    const Sound = {
      ctx: null,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      playTone(freq, type = 'sine', duration = 0.15) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + duration);
      },
      plop() { this.playTone(320, 'sine', 0.1); },
      pour() { this.playTone(220, 'triangle', 0.25); },
      coin() { this.playTone(987, 'sine', 0.3); },
      buzz() { this.playTone(130, 'sawtooth', 0.25); }
    };

    /* DỮ LIỆU GAME */
    const STATE = {
      day: 1,
      cash: 300000,
      piggyBank: 0,
      todaySales: 0,
      todayMarketCost: 0,
      timeLeft: 180,
      isPaused: false,
      selectedTableIdx: 0,
      tables: [null, null, null],
      inventory: {
        clean_bowls: 20, bun: 15, banh_da: 15, rieu_cua: 15, dau_ran: 15, tiet_luoc: 15,
        trung_lon: 10, cha_ca: 15, moc_nam: 15, suon_sun: 15, oc: 15, cha_la_lot: 15,
        bap_bo: 15, rau_song: 15, quay: 15
      },
      currentDish: {
        container: null, // 'bowl', 'box', 'hotpot'
        base: null,
        hasBroth: false,
        toppings: [],
        hasDrink: false,
        hasShrimpPaste: false,
        hasChili: false
      }
    };

    const TOPPING_NAMES = {
      rieu_cua: 'Gạch cua', dau_ran: 'Đậu rán', tiet_luoc: 'Tiết luộc', trung_lon: 'Trứng lộn',
      cha_ca: 'Chả cá', moc_nam: 'Mọc nấm', suon_sun: 'Sườn sụn', oc: 'Ốc bươu',
      cha_la_lot: 'Lá lốt', bap_bo: 'Bắp bò', rau_song: 'Rau sống', quay: 'Quẩy'
    };

    const TOPPING_ICONS = {
      rieu_cua: '🦀', dau_ran: '🧈', tiet_luoc: '🩸', trung_lon: '🥚',
      cha_ca: '🐟', moc_nam: '🧆', suon_sun: '🥓', oc: '🐌',
      cha_la_lot: '🌯', bap_bo: '🥩', rau_song: '🥬', quay: '🥖'
    };

    const CUSTOMER_TEMPLATES = [
      { name: 'Bà Lam', avatar: '👵', text: 'Cho bà 1 tô bún riêu cua, bắp bò, nhiều rau nha con!', base: 'bun', tops: ['rieu_cua', 'bap_bo', 'rau_song'], price: 45000 },
      { name: 'Anh Nam', avatar: '👨‍💼', text: '1 suất bánh đa đỏ thập cẩm, thêm mắm tôm và trà đá nhé!', base: 'banh_da', tops: ['rieu_cua', 'bap_bo', 'suon_sun'], needDrink: true, needShrimp: true, price: 65000 },
      { name: 'Shipper Shopee', avatar: '🛵', text: 'Đơn mang đi: 1 hộp bánh đa cua chả lá lốt gấp nhé!', isBox: true, base: 'banh_da', tops: ['rieu_cua', 'cha_la_lot'], price: 50000 },
      { name: 'Cậu Bé', avatar: '👦', text: 'Cô ơi cho cháu 1 tô bún đậu rán, trứng vịt lộn ngọt nước!', base: 'bun', tops: ['dau_ran', 'trung_lon'], price: 38000 }
    ];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-stone-900/95 text-white px-4 py-2 rounded-full border border-amber-400 shadow-xl text-xs font-bold pointer-events-none transition-all duration-300 opacity-100 translate-y-0 z-50';
      setTimeout(() => { t.className = t.className.replace('opacity-100 translate-y-0', 'opacity-0 -translate-y-2'); }, 1500);
    }

    function togglePauseGame() {
      STATE.isPaused = !STATE.isPaused;
      document.getElementById('pause-icon').textContent = STATE.isPaused ? '▶' : '⏸';
      showToast(STATE.isPaused ? 'Đã tạm dừng ca bán' : 'Tiếp tục bán bún');
    }

    function updateHUD() {
      document.getElementById('hud-day').textContent = `Ngày ${STATE.day}`;
      document.getElementById('hud-money').textContent = STATE.cash.toLocaleString('vi-VN') + 'đ';
      document.getElementById('hud-piggy').textContent = `Heo: ${STATE.piggyBank.toLocaleString('vi-VN')}đ`;
      document.getElementById('badge-bowls').textContent = STATE.inventory.clean_bowls;
      document.getElementById('badge-bun').textContent = STATE.inventory.bun;
      document.getElementById('badge-banh_da').textContent = STATE.inventory.banh_da;

      for (let k in TOPPING_NAMES) {
        const el = document.getElementById(`cnt-${k}`);
        if (el) el.textContent = STATE.inventory[k];
      }

      const m = Math.floor(STATE.timeLeft / 60), s = STATE.timeLeft % 60;
      document.getElementById('shift-clock').textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    /* CHỌN BÀN ĂN & CẬP NHẬT ORDER BALLOON */
    function selectTable(idx) {
      STATE.selectedTableIdx = idx;
      renderTables();
      renderOrderBalloon();
    }

    function renderTables() {
      for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`table-slot-${i}`);
        const cust = STATE.tables[i];
        const isSelected = STATE.selectedTableIdx === i;

        if (cust) {
          slot.className = `table-slot rounded-2xl p-1.5 flex flex-col items-center justify-center min-h-[64px] cursor-pointer transition ${
            isSelected ? 'bg-amber-950 border-2 border-amber-400 shadow-md' : 'bg-game-card border border-game'
          }`;
          slot.innerHTML = `
            <div class="relative">
              <span class="text-2xl">${cust.avatar}</span>
              ${cust.isBox ? '<span class="absolute -top-1 -right-2 text-[9px] bg-orange-600 px-1 rounded-full text-white font-bold">App</span>' : ''}
            </div>
            <span class="text-[10px] font-black text-amber-200 mt-0.5 truncate max-w-[70px]">${cust.name}</span>
          `;
        } else {
          slot.className = `table-slot rounded-2xl p-1.5 flex flex-col items-center justify-center min-h-[64px] cursor-pointer transition ${
            isSelected ? 'bg-stone-900 border-2 border-amber-400/80' : 'bg-game-card/50 border border-game/40'
          }`;
          slot.innerHTML = `<span class="text-[10px] text-stone-500 font-bold">Bàn trống</span>`;
        }
      }
    }

    function renderOrderBalloon() {
      const cust = STATE.tables[STATE.selectedTableIdx];
      const textEl = document.getElementById('order-dialogue-text');
      const iconEl = document.getElementById('order-bowl-icon');
      const barEl = document.getElementById('patience-bar');

      if (cust) {
        iconEl.textContent = cust.isBox ? '🥡' : '🥣';
        textEl.innerHTML = `<b class="text-amber-300 font-extrabold">${cust.name}:</b> "${cust.text}"`;
        barEl.style.width = `${(cust.patience / cust.maxPatience) * 100}%`;
      } else {
        iconEl.textContent = '🥣';
        textEl.textContent = 'Bàn này đang trống. Hãy bấm chọn bàn khác hoặc chờ khách ghé nhé!';
        barEl.style.width = '100%';
      }
    }

    /* THAO TÁC NẤU BẾP */
    function drawContainer(type) {
      if (STATE.currentDish.container) {
        showToast('Đã có vật chứa trên thớt rồi!');
        return;
      }
      if (type === 'bowl') {
        if (STATE.inventory.clean_bowls <= 0) {
          showToast('Hết bát sạch! Bấm Rửa bát hoặc vào Chợ mua thêm.');
          Sound.buzz();
          return;
        }
        STATE.inventory.clean_bowls--;
      }
      STATE.currentDish.container = type;
      Sound.plop();
      updatePrepMat();
      updateHUD();
      showToast(`Đã lấy ${type === 'bowl' ? 'Tô Sứ' : (type === 'box' ? 'Hộp Mang Về' : 'Nồi Lẩu')} lên thớt!`);
    }

    function selectNoodle(type) {
      if (!STATE.currentDish.container) { showToast('Lấy tô trước khi chọn bún!'); Sound.buzz(); return; }
      if (STATE.currentDish.base) { showToast('Đã có sợi trong tô rồi!'); return; }
      if (STATE.inventory[type] <= 0) { showToast('Đã hết loại sợi này trong kho!'); Sound.buzz(); return; }
      STATE.inventory[type]--;
      STATE.currentDish.base = type;
      Sound.plop();
      updatePrepMat();
      updateHUD();
    }

    function addBroth(type) {
      if (!STATE.currentDish.container) { showToast('Lấy tô trước khi chan nước!'); Sound.buzz(); return; }
      if (!STATE.currentDish.base) { showToast('Cho bún vào tô trước đã!'); Sound.buzz(); return; }
      if (STATE.currentDish.hasBroth) { showToast('Tô đã chan đầy nước dùng rồi!'); return; }
      STATE.currentDish.hasBroth = true;
      Sound.pour();
      updatePrepMat();
    }

    function addTopping(k) {
      if (!STATE.currentDish.container) { showToast('Lấy tô trước khi gắp topping!'); Sound.buzz(); return; }
      if (!STATE.currentDish.base) { showToast('Cho bún vào trước đã!'); Sound.buzz(); return; }
      if (STATE.inventory[k] <= 0) { showToast(`Đã hết ${TOPPING_NAMES[k]}!`); Sound.buzz(); return; }
      STATE.inventory[k]--;
      STATE.currentDish.toppings.push(k);
      Sound.plop();
      updatePrepMat();
      updateHUD();
    }

    function pourDrink() {
      STATE.currentDish.hasDrink = true;
      document.getElementById('badge-drink').classList.remove('hidden');
      Sound.pour();
      showToast('Đã rót 1 cốc Trà đá chuẩn bị giao kèm!');
    }

    function addShrimpPaste() {
      if (!STATE.currentDish.container) return;
      STATE.currentDish.hasShrimpPaste = true;
      document.getElementById('badge-shrimp').classList.remove('hidden');
      Sound.plop();
      showToast('Đã thêm 1 thìa Mắm tôm thơm lừng!');
    }

    function addChiliSauce() {
      if (!STATE.currentDish.container) return;
      STATE.currentDish.hasChili = true;
      document.getElementById('badge-chili').classList.remove('hidden');
      Sound.plop();
      showToast('Đã thêm Ớt sa tế cay nồng!');
    }

    function trashDish() {
      if (STATE.currentDish.container === 'bowl') STATE.inventory.clean_bowls++;
      STATE.currentDish = { container: null, base: null, hasBroth: false, toppings: [], hasDrink: false, hasShrimpPaste: false, hasChili: false };
      document.getElementById('badge-drink').classList.add('hidden');
      document.getElementById('badge-shrimp').classList.add('hidden');
      document.getElementById('badge-chili').classList.add('hidden');
      Sound.plop();
      updatePrepMat();
      updateHUD();
      showToast('Đã dọn sạch thớt chế biến!');
    }

    function updatePrepMat() {
      const pMat = document.getElementById('prep-mat');
      const promptEl = document.getElementById('prep-prompt');
      const visualEl = document.getElementById('visual-dish');
      const brothEl = document.getElementById('visual-broth');
      const noodleEl = document.getElementById('visual-noodle-layer');
      const topsEl = document.getElementById('visual-toppings-layer');

      if (!STATE.currentDish.container) {
        promptEl.classList.remove('hidden');
        visualEl.classList.add('hidden');
        return;
      }

      promptEl.classList.add('hidden');
      visualEl.classList.remove('hidden');

      if (STATE.currentDish.hasBroth) brothEl.classList.remove('hidden');
      else brothEl.classList.add('hidden');

      if (STATE.currentDish.base === 'bun') noodleEl.textContent = '🍜';
      else if (STATE.currentDish.base === 'banh_da') noodleEl.textContent = '🥢';
      else noodleEl.textContent = '';

      topsEl.innerHTML = '';
      STATE.currentDish.toppings.forEach(tKey => {
        const span = document.createElement('span');
        span.className = 'drop-item text-xl food-shadow';
        span.textContent = TOPPING_ICONS[tKey] || '✨';
        topsEl.appendChild(span);
      });
    }

    /* GIAO MÓN */
    function serveCurrentDish() {
      const cust = STATE.tables[STATE.selectedTableIdx];
      if (!cust) { showToast('Bàn này không có khách để giao!'); Sound.buzz(); return; }
      if (!STATE.currentDish.container) { showToast('Chưa nấu món nào trên thớt!'); Sound.buzz(); return; }

      const dish = STATE.currentDish;

      // Kiểm tra loại tô
      if (cust.isBox && dish.container !== 'box') {
        showToast('Khách gọi đơn mang đi, phải dùng Hộp về 🥡!'); Sound.buzz(); return;
      }
      if (!cust.isBox && dish.container !== 'bowl') {
        showToast('Khách ăn tại quán phải múc vào Tô sứ 🥣!'); Sound.buzz(); return;
      }

      // Kiểm tra sợi & nước dùng
      if (dish.base !== cust.base) {
        showToast(`Khách gọi ${cust.base === 'bun' ? 'Bún' : 'Bánh đa'}, bạn làm nhầm sợi rồi!`); Sound.buzz(); return;
      }
      if (!dish.hasBroth) { showToast('Quên chưa chan Nước cua vào tô kìa!'); Sound.buzz(); return; }

      // Kiểm tra đồ uống & gia vị nếu khách đòi
      if (cust.needDrink && !dish.hasDrink) { showToast('Khách có gọi thêm Trà đá!'); Sound.buzz(); return; }
      if (cust.needShrimp && !dish.hasShrimpPaste) { showToast('Khách dặn thêm Mắm tôm!'); Sound.buzz(); return; }

      // Kiểm tra toppings
      for (let req of cust.tops) {
        if (!dish.toppings.includes(req)) {
          showToast(`Tô còn thiếu: ${TOPPING_NAMES[req]}!`); Sound.buzz(); return;
        }
      }

      // Giao đúng đơn!
      Sound.coin();
      STATE.cash += cust.price;
      STATE.todaySales += cust.price;
      if (dish.container === 'bowl') STATE.inventory.clean_bowls++;

      showToast(`+${cust.price.toLocaleString('vi-VN')}đ! ${cust.name} khen nức nở.`);
      STATE.tables[STATE.selectedTableIdx] = null;
      trashDish();
      renderTables();
      renderOrderBalloon();
      updateHUD();
    }

    /* SINH KHÁCH MỚI */
    function spawnCustomer() {
      if (STATE.isPaused) return;
      const emptyIdx = STATE.tables.findIndex(t => t === null);
      if (emptyIdx !== -1) {
        const tmpl = CUSTOMER_TEMPLATES[Math.floor(Math.random() * CUSTOMER_TEMPLATES.length)];
        STATE.tables[emptyIdx] = {
          ...tmpl,
          patience: 40,
          maxPatience: 40
        };
        renderTables();
        if (STATE.selectedTableIdx === emptyIdx) renderOrderBalloon();
      }
    }

    /* TIỆN ÍCH MODAL: ĐI CHỢ, THUÊ NGƯỜI, HỤI, HEO */
    function openModal(type) {
      const container = document.getElementById('modal-container');
      const title = document.getElementById('modal-title');
      const content = document.getElementById('modal-content');
      container.classList.remove('hidden');

      if (type === 'market') {
        title.textContent = '🛒 Chợ Đầu Mối Cua Cá';
        content.innerHTML = `
          <div class="p-2 bg-game-card rounded-xl border border-game mb-2">
            <b>Tô bát sứ sạch:</b> Đang có ${STATE.inventory.clean_bowls} cái.
            <button onclick="buyMarket('clean_bowls', 10, 10000)" class="mt-1 w-full bg-amber-600 text-white font-bold py-1.5 rounded-lg active:scale-95">Mua 10 tô (10.000đ)</button>
          </div>
          <div class="p-2 bg-game-card rounded-xl border border-game mb-2">
            <b>Gạch riêu cua đồng:</b> Đang có ${STATE.inventory.rieu_cua} phần.
            <button onclick="buyMarket('rieu_cua', 10, 40000)" class="mt-1 w-full bg-amber-600 text-white font-bold py-1.5 rounded-lg active:scale-95">Mua 10 phần Cua (40.000đ)</button>
          </div>
          <div class="p-2 bg-game-card rounded-xl border border-game">
            <b>Bắp bò hoa tươi:</b> Đang có ${STATE.inventory.bap_bo} lạng.
            <button onclick="buyMarket('bap_bo', 10, 60000)" class="mt-1 w-full bg-amber-600 text-white font-bold py-1.5 rounded-lg active:scale-95">Mua 10 lạng Bò (60.000đ)</button>
          </div>
        `;
      } else if (type === 'shop') {
        title.textContent = '👥 Thuê Nhân Sự Phụ Quán';
        content.innerHTML = `
          <div class="p-2.5 bg-game-card rounded-xl border border-game">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-2xl">👧</span>
              <div>
                <b>Bé Na (Rửa Bát & Dọn Bàn)</b>
                <div class="text-[10px] text-stone-400">Tự động rửa sạch bát cất vào kho.</div>
              </div>
            </div>
            <button onclick="hireStaff('Na', 180000)" class="w-full bg-yellow-500 text-stone-950 font-black py-1.5 rounded-lg active:scale-95 mt-1">Thuê (180.000đ)</button>
          </div>
        `;
      } else if (type === 'hui') {
        title.textContent = '🤝 Hốt Hụi Phường Chợ';
        content.innerHTML = `
          <p class="text-stone-300 mb-3">Bốc ngay một bát họ <b>2.000.000đ</b> tiền mặt để mở rộng tiệm bún!</p>
          <button onclick="takeHui()" class="w-full bg-yellow-500 text-stone-950 font-black py-2.5 rounded-xl active:scale-95">HỐT HỤI 2.000.000đ</button>
        `;
      } else if (type === 'piggy') {
        title.textContent = '🐷 Nuôi Heo Mua Nhà Phố Cổ';
        content.innerHTML = `
          <div class="text-center p-3 bg-game-card rounded-2xl border border-game">
            <div class="text-3xl mb-1">🏛️</div>
            <p class="text-amber-300 font-bold mb-1">Mục tiêu: Mua nhà Hàng Bè (200.000.000đ)</p>
            <div class="text-xs text-stone-300">Đã tích lũy: <b class="text-pink-400">${STATE.piggyBank.toLocaleString('vi-VN')}đ</b></div>
          </div>
        `;
      }
    }

    function buyMarket(k, qty, cost) {
      if (STATE.cash < cost) { showToast('Không đủ tiền mặt!'); Sound.buzz(); return; }
      STATE.cash -= cost;
      STATE.inventory[k] += qty;
      Sound.coin();
      updateHUD();
      openModal('market');
      showToast('Đã nhập hàng vào kho thành công!');
    }

    function takeHui() {
      STATE.cash += 2000000;
      Sound.coin();
      updateHUD();
      closeModal();
      showToast('Đã hốt hụi thành công +2.000.000đ vào ví!');
    }

    function hireStaff(name, cost) {
      if (STATE.cash < cost) { showToast('Không đủ tiền thuê!'); Sound.buzz(); return; }
      STATE.cash -= cost;
      Sound.coin();
      updateHUD();
      closeModal();
      showToast(`Đã thuê ${name} về phụ tiệm bún!`);
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    /* KHỞI ĐỘNG VÒNG LẶP GAME */
    window.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('click', () => Sound.init(), { once: true });
      updateHUD();
      renderTables();
      renderOrderBalloon();
      updatePrepMat();

      // Đếm ngược ca bán (1s)
      setInterval(() => {
        if (!STATE.isPaused && STATE.timeLeft > 0) {
          STATE.timeLeft--;
          updateHUD();
        }
      }, 1000);

      // Sinh khách định kỳ (4s)
      setInterval(() => {
        spawnCustomer();
      }, 4000);

      // Giảm độ kiên nhẫn của khách (500ms)
      setInterval(() => {
        if (STATE.isPaused) return;
        for (let i = 0; i < 3; i++) {
          const c = STATE.tables[i];
          if (c) {
            c.patience -= 0.5;
            if (c.patience <= 0) {
              STATE.tables[i] = null;
              showToast(`Khách ở bàn ${i+1} đợi lâu quá nên đã bỏ về!`);
              renderTables();
              if (STATE.selectedTableIdx === i) renderOrderBalloon();
            }
          }
        }
        if (STATE.tables[STATE.selectedTableIdx]) renderOrderBalloon();
      }, 500);
    });
  </script>
</body>
</html>
